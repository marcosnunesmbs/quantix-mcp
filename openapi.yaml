          description: Transfer not found
      security: *ref_18
      summary: Update a transfer
      tags: *ref_19
    delete:
      operationId: remove
      parameters:
        - *ref_17
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '204':
          description: Transfer deleted
        '404':
          description: Transfer not found
      security: *ref_18
      summary: Delete a transfer
      tags: *ref_19
  /subscriptions:
    post:
      operationId: create
      parameters:
        - &ref_20
          name: x-api-key
          in: header
          required: false
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionDto'
      responses:
        '201':
          description: Subscription created successfully.
        '400':
          description: Invalid input.
        '404':
          description: Credit card not found.
      security: &ref_21
        - bearer: []
      summary: Create a new subscription
      tags: &ref_22
        - subscriptions
    get:
      operationId: findAll
      parameters:
        - *ref_20
      responses:
        '200':
          description: List of subscriptions.
      security: *ref_21
      summary: Get all subscriptions
      tags: *ref_22
  /subscriptions/active:
    get:
      operationId: findActive
      parameters:
        - *ref_20
      responses:
        '200':
          description: List of active subscriptions.
      security: *ref_21
      summary: Get all active subscriptions
      tags: *ref_22
  /subscriptions/{id}:
    get:
      operationId: findOne
      parameters:
        - *ref_20
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Subscription found.
        '404':
          description: Subscription not found.
      security: *ref_21
      summary: Get a subscription by ID
      tags: *ref_22
    patch:
      operationId: update
      parameters:
        - *ref_20
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubscriptionDto'
      responses:
        '200':
          description: Subscription updated successfully.
        '404':
          description: Subscription or credit card not found.
      security: *ref_21
      summary: Update a subscription
      tags: *ref_22
    delete:
      operationId: remove
      parameters:
        - *ref_20
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Subscription deactivated successfully.
        '404':
          description: Subscription not found.
      security: *ref_21
      summary: Deactivate a subscription (soft delete)
      tags: *ref_22
  /subscriptions/{id}/permanent:
    delete:
      operationId: hardDelete
      parameters:
        - *ref_20
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Subscription deleted permanently.
        '404':
          description: Subscription not found.
      security: *ref_21
      summary: Permanently delete a subscription
      tags: *ref_22
  /subscriptions/{id}/reactivate:
    patch:
      operationId: reactivate
      parameters:
        - *ref_20
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: Subscription reactivated successfully.
        '404':
          description: Subscription not found.
      security: *ref_21
      summary: Reactivate a deactivated subscription
      tags: *ref_22
  /api-keys:
    post:
      operationId: create
      parameters: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyDto'
      responses:
        '201':
          description: ''
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiKeyResponseDto'
      security: &ref_23
        - bearer: []
      summary: Create a new API Key
      tags: &ref_24
        - api-keys
    get:
      operationId: findAll
      parameters: []
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyResponseDto'
      security: *ref_23
      summary: List your API Keys
      tags: *ref_24
  /api-keys/{id}:
    delete:
      operationId: revoke
      parameters:
        - name: id
