      tags: *ref_24
info:
  title: Quantix Personal Finance Manager API
  description: >-
    O Quantix é um gerenciador financeiro pessoal moderno, projetado para ajudar
    indivíduos a controlarem suas finanças de maneira simples, eficaz e segura.


    ## Principais Recursos

    - **Multi-usuário**: Suporte total a múltiplos usuários com isolamento
    completo de dados.

    - **Controle de Transações**: Gestão de receitas, despesas e transferências
    entre contas.

    - **Cartões de Crédito**: Acompanhamento de faturas, limites e pagamentos.

    - **Categorias e Organização**: Classificação visual de gastos com
    categorias personalizáveis.

    - **Assinaturas e Recorrência**: Automação de lançamentos frequentes
    (Netflix, aluguel, etc.).

    - **Segurança**: Autenticação robusta via JWT e armazenamento seguro de
    senhas com Bcrypt.


    ## Autenticação

    Esta API utiliza autenticação baseada em **JWT (JSON Web Token)**.

    1. Registre-se ou faça login através dos endpoints de `/auth` para receber
    seu token de acesso.

    2. Inclua o token no header de autorização em todas as requisições
    protegidas:

    ```

    Authorization: Bearer <seu-token-aqui>

    ```


    ## Base URL

    Todos os endpoints da API são relativos a: `http://localhost:3000/api`
          
  version: 0.4.2
  contact:
    name: Quantix Support
    url: https://github.com/marcosnunesmbs/quantix
    email: support@example.com
  license:
    name: MIT
    url: https://github.com/marcosnunesmbs/quantix/blob/main/LICENSE
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          example: Groceries
        type:
          type: string
          description: Type of the category
          enum:
            - INCOME
            - EXPENSE
          example: EXPENSE
        color:
          type: object
          description: Color for the category in hexadecimal format
          example: '#FF5733'
          nullable: true
      required:
        - name
        - type
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          example: Groceries
        color:
          type: object
          description: Color for the category in hexadecimal format
          example: '#FF5733'
          nullable: true
    RegisterDto:
      type: object
      properties:
        name:
          type: string
          description: User name
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
          minLength: 6
      required:
        - name
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
      required:
        - email
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current user password
        newPassword:
          type: string
          description: New user password
          minLength: 6
      required:
        - currentPassword
        - newPassword
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          description: User email
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Reset token received by email
        newPassword:
          type: string
          description: New user password
          minLength: 6
      required:
        - token
        - newPassword
    RecurrenceDto:
      type: object
      properties:
        frequency:
          type: string
          description: Frequency of recurrence
          enum:
            - WEEKLY
            - MONTHLY
            - YEARLY
          example: MONTHLY
        interval:
          type: number
          description: Interval between recurrences
          example: 1
          minimum: 1
        startDate:
          type: object
          description: Start date for recurrence
          example: '2026-01-30'
        endDate:
          type: string
          description: >-
            End date for recurrence (optional, mutually exclusive with
            occurrences)
          example: '2026-12-31'
        occurrences:
          type: number
          description: Number of occurrences (optional, mutually exclusive with endDate)
          example: 12
          minimum: 2
      required:
        - frequency
        - interval
        - startDate
    CreateTransactionDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the transaction
          enum: &ref_25
            - INCOME
            - EXPENSE
          example: EXPENSE
        name:
          type: object
          description: Name or description of the transaction
          example: Grocery shopping
        amount:
          type: object
          description: Amount of the transaction
          example: 125.75
          minimum: 0
        date:
          type: object
          description: >-
            Date of the transaction (for credit cards, this will be overridden
            by the due day of the card if targetDueMonth is provided)
          example: '2026-01-30'
        categoryId:
          type: string
          description: ID of the associated category
          example: cat_123456789
        paymentMethod:
          type: string
          description: Method of payment
          enum: &ref_26
            - CASH
            - PIX
            - DEBIT
            - CREDIT
          example: CREDIT
        creditCardId:
          type: string
          description: >-
            ID of the associated credit card (required if paymentMethod is
            CREDIT)
          example: cc_123456789
        installments:
          type: number
          description: Number of installments (optional)
          example: 3
          minimum: 1
        targetDueMonth:
          type: string
          description: Target month for due date in YYYY-MM format (optional)
          example: 2026-03
        isRecurring:
          type: boolean
          description: Whether the transaction is recurring
          example: false
          default: false
        recurrence:
          description: Recurrence information (optional)
          allOf:
            - $ref: '#/components/schemas/RecurrenceDto'
        accountId:
          type: string
          description: >-
            ID of the associated account (required if paymentMethod is not
            CREDIT)
          example: acc_123456789
        isPaid:
          type: boolean
          description: Whether the transaction has been paid
          example: false
          default: false
        purchaseDate:
          type: string
          description: Actual purchase date (credit card only)
          example: '2026-02-10'
      required:
        - type
        - name
        - amount
        - date
    CategoryDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
            - INCOME
            - EXPENSE
        color:
          type: object
          nullable: true
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - type
        - createdAt
    CreditCardDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        brand:
          type: string
        limitAmount:
          type: number
        closingDay:
          type: number
        dueDay:
          type: number
        availableLimit:
          type: number
        createdAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - limitAmount
        - closingDay
        - dueDay
        - createdAt
    RecurrenceRule:
      type: object
      properties: {}
    SubscriptionDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        amount:
          type: number
        billingDay:
          type: number
        creditCardId:
          type: string
        categoryId:
          type: string
        active:
          type: boolean
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - name
        - amount
        - billingDay
        - creditCardId
        - active
        - createdAt
        - updatedAt
    AccountDto:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
        initialBalance:
          type: number
        currentBalance:
          type: number
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - name
        - type
        - initialBalance
        - currentBalance
    TransactionWithRelationsDto:
      type: object
      properties:
        id:
          type: string
        type:
          type: string
          enum:
            - INCOME
            - EXPENSE
        name:
          type: string
        amount:
          type: number
        date:
          format: date-time
          type: string
        categoryId:
          type: string
        category:
          $ref: '#/components/schemas/CategoryDto'
        paymentMethod:
          type: string
          enum:
            - CASH
            - PIX
            - DEBIT
            - CREDIT
        creditCardId:
          type: string
        creditCard:
          $ref: '#/components/schemas/CreditCardDto'
        recurrenceRule:
          $ref: '#/components/schemas/RecurrenceRule'
        subscriptionId:
          type: string
        subscription:
          $ref: '#/components/schemas/SubscriptionDto'
        accountId:
          type: string
        account:
          $ref: '#/components/schemas/AccountDto'
        installmentGroupId:
          type: string
        installmentNumber:
          type: number
        installmentTotal:
          type: number
        recurrenceRuleId:
          type: string
        paid:
          type: boolean
        createdAt:
          format: date-time
          type: string
        purchaseDate:
          format: date-time
          type: string
        linkedTransactionId:
          type: string
        isAnticipation:
          type: boolean
          description: >-
            Indicates if this transaction is part of a credit card anticipation
            pair
      required:
        - id
        - type
        - name
        - amount
        - date
        - paid
        - createdAt
    UpdateTransactionDto:
      type: object
      properties:
        type:
          type: string
          description: Type of the transaction
          enum: *ref_25
          example: EXPENSE
        name:
          type: object
          description: Name or description of the transaction
          example: Grocery shopping
        amount:
          type: object
          description: Amount of the transaction
          example: 125.75
          minimum: 0
        date:
          type: object
          description: >-
            Date of the transaction (for credit cards, this will be overridden
            by the due day of the card if targetDueMonth is provided)
          example: '2026-01-30'
        categoryId:
          type: string
          description: ID of the associated category
          example: cat_123456789
        paymentMethod:
          type: string
          description: Method of payment
          enum: *ref_26
          example: CREDIT
        creditCardId:
          type: string
          description: >-
            ID of the associated credit card (required if paymentMethod is
            CREDIT)
          example: cc_123456789
        installments:
          type: number
          description: Number of installments (optional)
          example: 3
          minimum: 1
        targetDueMonth:
          type: string
          description: >-
            Target month for due date in YYYY-MM format (optional). When
            provided for CREDIT payments, the transaction date will be set to
            the credit card's due day in the specified month.
          example: 2026-03
        isRecurring:
          type: boolean
          description: Whether the transaction is recurring
          example: false
          default: false
        recurrence:
          description: Recurrence information (optional)
          allOf:
            - $ref: '#/components/schemas/RecurrenceDto'
        accountId:
          type: string
          description: >-
            ID of the associated account (required if paymentMethod is not
            CREDIT)
          example: acc_123456789
        isPaid:
          type: boolean
          description: Whether the transaction has been paid
          example: false
          default: false
        purchaseDate:
          type: string
          description: Actual purchase date (credit card only)
          example: '2026-02-10'
    CreateCreditCardDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the credit card
          example: Nubank Platinum
        brand:
          type: string
          description: Brand of the credit card
          example: Visa
        limitAmount:
          type: number
          description: Credit limit of the card
          example: 5000
          minimum: 0
        closingDay:
          type: number
          description: Day of the month when the billing cycle closes
          example: 15
          minimum: 1
          maximum: 31
        dueDay:
          type: number
          description: Day of the month when the bill is due
          example: 22
          minimum: 1
          maximum: 31
      required:
        - name
        - limitAmount
        - closingDay
        - dueDay
    UpdateCreditCardDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the credit card
          example: Nubank Platinum
        brand:
          type: string
          description: Brand of the credit card
          example: Visa
        limitAmount:
          type: number
          description: Credit limit of the card
          example: 5000
          minimum: 0
        closingDay:
          type: number
          description: Day of the month when the billing cycle closes
          example: 15
          minimum: 1
          maximum: 31
        dueDay:
          type: number
          description: Day of the month when the bill is due
          example: 22
          minimum: 1
          maximum: 31
    PayStatementDto:
      type: object
      properties:
        month:
          type: object
          description: Month for the statement in YYYY-MM format
          example: 2026-03
        paymentAccountId:
          type: object
          description: ID of the account to debit for the payment
          example: acc_123456789
      required:
        - month
        - paymentAccountId
    ReopenStatementDto:
      type: object
      properties:
        month:
          type: object
          description: Month for the statement in YYYY-MM format
          example: 2026-03
      required:
        - month
    CreateAnticipationDto:
      type: object
      properties:
        name:
          type: string
          description: Name/description of the anticipation
        amount:
          type: number
          description: Amount to anticipate
          minimum: 0.01
        purchaseDate:
          type: string
          description: Date the money leaves the account (YYYY-MM-DD)
          example: '2026-02-23'
        targetDueMonth:
          type: string
          description: Target statement due month (YYYY-MM)
          example: 2026-03
        accountId:
          type: string
          description: Account ID from which money will be debited
        categoryId:
          type: string
          description: Category ID for both transactions
      required:
        - name
        - amount
        - purchaseDate
        - targetDueMonth
        - accountId
    CreateAccountDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the account
          example: Itaú Checking Account
        type:
          type: string
          description: Type of account
          enum: &ref_27
            - BANK_ACCOUNT
            - WALLET
            - SAVINGS_ACCOUNT
            - INVESTMENT_ACCOUNT
            - OTHER
          example: BANK_ACCOUNT
        initialBalance:
          type: number
          description: Initial balance for the account
          example: 1000
      required:
        - name
        - type
    AccountResponseDto:
      type: object
      properties:
        id:
          type: string
          description: Unique identifier for the account
          example: uuid-string
        name:
          type: string
          description: Name of the account
          example: Itaú Checking Account
        type:
          type: string
          description: Type of account
          enum:
            - BANK_ACCOUNT
            - WALLET
            - SAVINGS_ACCOUNT
            - INVESTMENT_ACCOUNT
            - OTHER
          example: BANK_ACCOUNT
        initialBalance:
          type: number
          description: Initial balance when the account was created
          example: 1000
        currentBalance:
          type: number
          description: Current balance of the account
          example: 850
        createdAt:
          format: date-time
          type: string
          description: Timestamp when the account was created
          example: '2026-02-11T12:00:00Z'
        updatedAt:
          format: date-time
          type: string
          description: Timestamp when the account was last updated
          example: '2026-02-11T15:30:00Z'
      required:
        - id
        - name
        - type
        - initialBalance
        - currentBalance
        - createdAt
        - updatedAt
    UpdateAccountDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the account
          example: Itaú Checking Account
        type:
          type: string
          description: Type of account
          enum: *ref_27
          example: BANK_ACCOUNT
        initialBalance:
          type: number
          description: Initial balance for the account
          example: 1000
    SettingsResponseDto:
      type: object
      properties:
        language:
          type: string
          description: Preferred language
          example: pt-BR
          enum:
            - pt-BR
            - en-US
        currency:
          type: string
          description: Default currency
          example: BRL
          enum:
            - BRL
            - USD
            - EUR
            - GBP
            - JPY
            - CAD
            - AUD
            - CHF
        createdAt:
          type: string
          description: Settings creation date
          example: '2024-01-15T10:30:00.000Z'
        updatedAt:
          type: string
          description: Settings last update date
          example: '2024-01-15T10:30:00.000Z'
      required:
        - language
        - currency
        - createdAt
        - updatedAt
    UpdateSettingsDto:
      type: object
      properties:
        userName:
          type: string
          description: User name
          example: John Doe
        language:
          type: string
          description: Preferred language
          example: pt-BR
          enum:
            - pt-BR
            - en-US
        currency:
          type: string
          description: Default currency
          example: BRL
          enum:
            - BRL
            - USD
            - EUR
            - GBP
            - JPY
            - CAD
            - AUD
            - CHF
    ImportDataDto:
      type: object
      properties: {}
    CreateTransferDto:
      type: object
      properties:
        sourceAccountId:
          type: string
          description: ID of the source account
        destinationAccountId:
          type: string
          description: ID of the destination account
        amount:
          type: number
          description: Amount to transfer
          minimum: 0.01
        date:
          type: string
          description: Date of the transfer (YYYY-MM-DD)
          example: '2026-02-17'
      required:
        - sourceAccountId
        - destinationAccountId
        - amount
        - date
    TransferResponseDto:
      type: object
      properties:
        id:
          type: string
        sourceAccountId:
          type: string
        destinationAccountId:
          type: string
        amount:
          type: number
        date:
          type: string
          description: Date of the transfer (YYYY-MM-DD)
        createdAt:
          format: date-time
          type: string
        updatedAt:
          format: date-time
          type: string
      required:
        - id
        - sourceAccountId
        - destinationAccountId
        - amount
        - date
        - createdAt
        - updatedAt
    UpdateTransferDto:
      type: object
      properties:
        sourceAccountId:
          type: string
          description: ID of the source account
        destinationAccountId:
          type: string
          description: ID of the destination account
        amount:
          type: number
          description: Amount to transfer
          minimum: 0.01
        date:
          type: string
          description: Date of the transfer (YYYY-MM-DD)
          example: '2026-02-17'
    CreateSubscriptionDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the subscription (e.g., Netflix, Spotify)
          example: Netflix
        amount:
          type: number
          description: Monthly amount charged
          example: 55.9
          minimum: 0.01
        billingDay:
          type: number
          description: Day of the month when the subscription is charged (1-31)
          example: 15
          minimum: 1
          maximum: 31
        creditCardId:
          type: string
          description: ID of the credit card used for this subscription
          example: cc_123456789
        categoryId:
          type: string
          description: ID of the expense category
          example: cat_123456789
      required:
        - name
        - amount
        - billingDay
        - creditCardId
    UpdateSubscriptionDto:
      type: object
      properties:
        name:
