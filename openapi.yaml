info:
  title: Quantix Personal Finance Manager API
  description: >-
    O Quantix é um gerenciador financeiro pessoal moderno, projetado para ajudar
    indivíduos a controlarem suas finanças de maneira simples, eficaz e segura.


    ## Principais Recursos

    - **Multi-usuário**: Suporte total a múltiplos usuários com isolamento
    completo de dados.

    - **Controle de Transações**: Gestão de receitas, despesas e transferências
    entre contas.

    - **Cartões de Crédito**: Acompanhamento de faturas, limites e pagamentos.

    - **Categorias e Organização**: Classificação visual de gastos com
    categorias personalizáveis.

    - **Assinaturas e Recorrência**: Automação de lançamentos frequentes
    (Netflix, aluguel, etc.).

    - **Segurança**: Autenticação robusta via JWT e armazenamento seguro de
    senhas com Bcrypt.


    ## Autenticação

    Esta API utiliza autenticação baseada em **JWT (JSON Web Token)**.

    1. Registre-se ou faça login através dos endpoints de `/auth` para receber
    seu token de acesso.

    2. Inclua o token no header de autorização em todas as requisições
    protegidas:

    ```

    Authorization: Bearer <seu-token-aqui>

    ```


    ## Base URL

    Todos os endpoints da API são relativos a: `http://localhost:3000/api`
          
  version: 1.2.5
  contact:
    name: Quantix Support
    url: https://github.com/marcosnunesmbs/quantix
    email: support@example.com
  license:
    name: MIT
    url: https://github.com/marcosnunesmbs/quantix/blob/main/LICENSE
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      scheme: bearer
      bearerFormat: JWT
      type: http
  schemas:
    CreateSubscriptionDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the subscription (e.g., Netflix, Spotify)
          example: Netflix
        amount:
          type: number
          description: Monthly amount charged
          example: 55.9
          minimum: 0.01
        billingDay:
          type: number
          description: Day of the month when the subscription is charged (1-31)
          example: 15
          minimum: 1
          maximum: 31
        creditCardId:
          type: string
          description: ID of the credit card used for this subscription
          example: cc_123456789
        categoryId:
          type: string
          description: ID of the expense category
          example: cat_123456789
      required:
        - name
        - amount
        - billingDay
        - creditCardId
    UpdateSubscriptionDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the subscription
          example: Netflix Premium
        amount:
          type: number
          description: Monthly amount charged
          example: 79.9
          minimum: 0.01
        billingDay:
          type: number
          description: Day of the month when the subscription is charged (1-31)
          example: 10
          minimum: 1
          maximum: 31
        creditCardId:
          type: string
          description: ID of the credit card used for this subscription
          example: cc_987654321
        categoryId:
          type: string
          description: ID of the expense category
          example: cat_123456789
        active:
          type: boolean
          description: Whether the subscription is active
          example: true
    RegisterDto:
      type: object
      properties:
        name:
          type: string
          description: User name
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
          minLength: 6
        inviteCode:
          type: string
          description: Invitation code (required if invite mode is ON)
      required:
        - name
        - email
        - password
    LoginDto:
      type: object
      properties:
        email:
          type: string
          description: User email
        password:
          type: string
          description: User password
      required:
        - email
        - password
    ChangePasswordDto:
      type: object
      properties:
        currentPassword:
          type: string
          description: Current user password
        newPassword:
          type: string
          description: New user password
          minLength: 6
      required:
        - currentPassword
        - newPassword
    ForgotPasswordDto:
      type: object
      properties:
        email:
          type: string
          description: User email
      required:
        - email
    ResetPasswordDto:
      type: object
      properties:
        token:
          type: string
          description: Reset token received by email
        newPassword:
          type: string
          description: New user password
          minLength: 6
      required:
        - token
        - newPassword
    SendMessageDto:
      type: object
      properties: {}
    CreateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          example: Groceries
        type:
          type: string
          description: Type of the category
          enum:
            - INCOME
            - EXPENSE
          example: EXPENSE
        color:
          type: object
          description: Color for the category in hexadecimal format
          example: '#FF5733'
          nullable: true
      required:
        - name
        - type
    UpdateCategoryDto:
      type: object
      properties:
        name:
          type: string
          description: Name of the category
          example: Groceries
        color:
          type: object
          description: Color for the category in hexadecimal format
          example: '#FF5733'
          nullable: true
    RecurrenceDto:
      type: object
      properties:
        frequency:
          type: string
          description: Frequency of recurrence
          enum:
            - WEEKLY
            - MONTHLY
            - YEARLY
          example: MONTHLY
