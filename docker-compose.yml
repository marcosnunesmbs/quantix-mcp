services:
  quantix-mcp:
    build: .
    ports:
      - "${MCPPORT:-3001}:${MCPPORT:-3001}"
    environment:
      TRANSPORT: http
      MCPPORT: ${MCPPORT:-3001}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:' + (process.env.MCPPORT || 3001) + '/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
